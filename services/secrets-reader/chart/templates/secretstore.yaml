{{- if .Values.secretStore.enabled }}
{{- $kind := .Values.secretStore.kind }}
{{- $cluster := eq $kind "ClusterSecretStore" }}
{{- $url := include "cloudwarden-secrets.url" . }}
{{- range $store := list (dict "name" $.Values.secretStore.name "path" "/v1/secrets/{{ .remoteRef.key }}" "jsonPath" "$.value") (dict "name" $.Values.secretStore.projectsName "path" "/v1/projects/{{ .remoteRef.key }}" "jsonPath" "$") }}
---
apiVersion: external-secrets.io/v1
kind: {{ $kind }}
metadata:
  name: {{ $store.name }}
  labels:
    {{- include "cloudwarden-secrets.labels" $ | nindent 4 }}
spec:
  provider:
    webhook:
      url: {{ printf "%s%s" $url $store.path | quote }}
      result:
        jsonPath: {{ $store.jsonPath | quote }}
      headers:
        Authorization: {{ printf "Bearer {{ print .auth.%s }}" $.Values.readerTokenSecret.key | quote }}
      secrets:
        - name: auth
          secretRef:
            name: {{ $.Values.readerTokenSecret.name }}
            {{- if $cluster }}
            namespace: {{ $.Release.Namespace }}
            {{- end }}
{{- end }}
{{- end }}
