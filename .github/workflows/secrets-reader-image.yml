name: Secrets reader image
# Builds services/secrets-reader (the Secrets Manager's in-cluster reader for External Secrets
# Operator) and pushes it to Cloudflare's container registry as
# cloudwarden-secrets-reader:<short sha>, where the tcp cluster pulls its images from.
on:
  push:
    branches: [main]
    paths: ['services/secrets-reader/**', '.github/workflows/secrets-reader-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-reader-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable on the production environment"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Test
        working-directory: services/secrets-reader
        run: docker run --rm -v "$PWD":/src -w /src golang:1.27.2 go test ./...
      - name: Build
        working-directory: services/secrets-reader
        run: |
          tag="${GITHUB_SHA::12}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build -t "cloudwarden-secrets-reader:$tag" .
      - name: Push to registry.cloudflare.com
        run: |
          npx --yes wrangler@4 containers push "cloudwarden-secrets-reader:$TAG"
          echo "::notice::pushed registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/cloudwarden-secrets-reader:$TAG"
