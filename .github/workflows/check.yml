name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      runner: ${{ steps.hive.outputs.runner }}
    steps:
      # Your hive when one of its machines is free, ubuntu-latest when none is.
      - id: hive
        uses: thecomputerplumbers/hiverunner/route@v1

  check:
    needs: route
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - name: Test the built Worker with isolated local data and simulated mail
        run: node tests/run-worker-smoke.mjs
